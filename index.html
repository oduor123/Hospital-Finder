<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Finder - Kenya Nationwide</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🏥 Find Nearest Hospital - Kenya</h1>
    <p>Nationwide recommendation • All 47 Counties • Ukunda to Garissa</p>
  </header>
  <main>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="🔍 Search town, county, hospital or symptom e.g. Nairobi, pregnant, fever...">
      <button id="locateBtn">📍 Use My Location</button>
      <select id="countyFilter">
        <option value="All">All Counties</option>
        <option value="Kwale">Kwale</option>
        <option value="Mombasa">Mombasa</option>
        <option value="Nairobi">Nairobi</option>
        <option value="Kisumu">Kisumu</option>
        <option value="Nakuru">Nakuru</option>
        <option value="Uasin Gishu">Uasin Gishu</option>
        <option value="Garissa">Garissa</option>
        <option value="Kakamega">Kakamega</option>
        <option value="Nyeri">Nyeri</option>
        <option value="Meru">Meru</option>
        <option value="Machakos">Machakos</option>
        <option value="Kisii">Kisii</option>
        <option value="Kiambu">Kiambu</option>
        <option value="Kilifi">Kilifi</option>
      </select>
      <select id="specialtyFilter">
        <option value="All">All Specialties</option>
        <option value="Emergency">Emergency</option>
        <option value="Maternity">Maternity</option>
        <option value="Pediatrics">Pediatrics</option>
        <option value="Surgery">Surgery</option>
        <option value="General">General</option>
        <option value="Oncology">Oncology</option>
        <option value="Cardiology">Cardiology</option>
      </select>
      <label><input type="checkbox" id="nhifFilter"> NHIF Only</label>
      <label><input type="checkbox" id="open24Filter"> 24hr Only</label>
    </div>
    <p id="status">Search any town in Kenya or click Use My Location.</p>
    <div id="results"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
